[project]
name = "scholarplan"
version = "1.0.0"
description = "ScholarPlan: an LLM-powered multi-agent planning system for academic research and information gathering."
readme = "README.md"
authors = [{ name = "Adil Aljasmi" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",            # HTTP client for the scholarly APIs and the LLM endpoint
    "pydantic>=2.7",          # schema validation of every LLM JSON output
    "python-dotenv>=1.0",     # API keys live in .env, never in source control
    "numpy>=1.26",
    "sentence-transformers>=3.0",  # local embeddings (Reimers and Gurevych, 2019)
    "sqlite-vec>=0.1.6",      # vector index stored inside SQLite
    "streamlit>=1.40",        # web dashboard showing the blackboard live
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
scholarplan = "scholarplan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "live: calls real external services (Groq, arXiv, OpenAlex, Crossref); skipped unless --live is given",
    "functional: end-to-end behaviour of the whole multi-agent system",
]
